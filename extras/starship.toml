# Prompt.
#
# Colors are ANSI names on purpose, not hex: they resolve through the terminal
# palette Omarchy writes for whatever theme is current, so the prompt follows a
# theme switch instead of pinning one theme's palette.
#
# Hierarchy, brightest to quietest: where you are (repo root) > what you are on
# (branch) > what is dirty (status) > everything else.

add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold purple)"
vimcmd_symbol = "[❮](bold cyan)"

[directory]
style = "white"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold purple"
read_only_style = "yellow"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "yellow"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
